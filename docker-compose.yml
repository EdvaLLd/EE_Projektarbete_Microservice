services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    env_file:
      - ./auth-service/.env
    depends_on:
      - postgres

  task-service:
    build: ./task-service
    ports:
      - "8082:8082"
    env_file:
      - ./task-service/.env
    depends_on:
      - postgres


  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - auth-service
      - task-service
    ports:
      - "5173:80"

volumes:
  postgres_data: